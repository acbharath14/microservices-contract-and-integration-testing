name: contract-tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  java-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract and integration tests
        run: mvn -q test
        working-directory: integration-tests

  python-release-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release suite
        run: python demo/run_release_suite.py
