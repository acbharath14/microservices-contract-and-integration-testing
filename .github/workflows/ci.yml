name: contract-tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  java-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract and integration tests
        run: mvn -q test
        working-directory: integration-tests
      - name: Build readable test summary
        if: always()
        run: |
          echo "# Contract Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in integration-tests/target/surefire-reports/*.txt; do
            echo "## $(basename $f .txt)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "Tests run|Test set" "$f" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: integration-tests/target/surefire-reports/

  python-release-demo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release suite
        run: python demo/run_release_suite.py
      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-suite-report
          path: reports/
