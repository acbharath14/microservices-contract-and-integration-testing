openapi: 3.0.3
info:
  title: Order Decision Service
  version: 1.0.0
  description: >
    Minimal contract used by OpenApiValidationTest to validate the provider's
    live responses against the consumer's expectations. Mirrors
    contracts/order_contract.json.
paths:
  /orders/123:
    get:
      operationId: getOrder
      responses:
        '200':
          description: Order decision for order 123
          content:
            application/json:
              schema:
                type: object
                required:
                  - orderId
                  - status
                  - customerTier
                properties:
                  orderId:
                    type: integer
                  status:
                    type: string
                    enum: [APPROVED, REJECTED, PENDING]
                  customerTier:
                    type: string
                    enum: [GOLD, SILVER, BRONZE]
