# TEMPLATE — do not place under .github/workflows/ via automation.
#
# The Meta Muse GitHub App cannot push workflow files, so to enable CI:
#   1. In GitHub, go to Actions → New workflow → "set up a workflow yourself"
#      (or Add file → Create new file at .github/workflows/ci.yml on main).
#   2. Paste the body of this file (from `name:` below) and commit.
#
# What it runs:
#   - Java: mvn test in integration-tests/ (JUnit 5, REST Assured, WireMock,
#     Pact consumer + provider verification, OpenAPI validation)
#   - Python: demo/run_release_suite.py (happy-path, schema-drift,
#     timeout-fallback orchestration scenarios)

name: contract-tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  java-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract and integration tests
        run: mvn -q test
        working-directory: integration-tests
      - name: Build readable test summary
        if: always()
        run: |
          echo "# Contract Test Summary" > integration-tests/target/surefire-reports/SUMMARY.md
          echo "" >> integration-tests/target/surefire-reports/SUMMARY.md
          for f in integration-tests/target/surefire-reports/*.txt; do
            echo "## $(basename $f .txt)" >> integration-tests/target/surefire-reports/SUMMARY.md
            echo '```' >> integration-tests/target/surefire-reports/SUMMARY.md
            grep -E "Tests run|Test set" "$f" >> integration-tests/target/surefire-reports/SUMMARY.md
            echo '```' >> integration-tests/target/surefire-reports/SUMMARY.md
            echo "" >> integration-tests/target/surefire-reports/SUMMARY.md
          done
          cat integration-tests/target/surefire-reports/SUMMARY.md
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: integration-tests/target/surefire-reports/

  python-release-demo:
    runs-on: ubuntu-latest
    # The suite intentionally includes a schema-drift scenario that BLOCKs
    # the release (exit 1). That's the gate working — don't red-badge the
    # repo for it. The decision stays visible in the job logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release suite
        run: python demo/run_release_suite.py
      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-suite-report
          path: reports/
