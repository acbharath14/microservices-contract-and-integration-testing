# TEMPLATE — do not place under .github/workflows/ via automation.
#
# The Meta Muse GitHub App cannot push workflow files, so to enable CI:
#   1. In GitHub, go to Actions → New workflow → "set up a workflow yourself"
#      (or Add file → Create new file at .github/workflows/ci.yml on main).
#   2. Paste the body of this file (from `name:` below) and commit.
#
# What it runs:
#   - Java: mvn test in integration-tests/ (JUnit 5, REST Assured, WireMock,
#     Pact consumer + provider verification, OpenAPI validation)
#   - Python: demo/run_release_suite.py (happy-path, schema-drift,
#     timeout-fallback orchestration scenarios)

name: contract-tests

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  java-contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run contract and integration tests
        run: mvn -q test
        working-directory: integration-tests
      - name: Build readable test summary
        if: always()
        run: |
          python3 - << 'EOF' >> $GITHUB_STEP_SUMMARY
          import glob, xml.etree.ElementTree as ET
          print("# Contract Test Summary\n")
          tp = tf = te = ts = 0
          for xf in sorted(glob.glob("integration-tests/target/surefire-reports/TEST-*.xml")):
              root = ET.parse(xf).getroot()
              print(f"## {root.get('name', xf)}")
              for tc in root.iter("testcase"):
                  tname = tc.get("name")
                  if tc.find("failure") is not None: s, icon = "FAIL", "\u274c"
                  elif tc.find("error") is not None: s, icon = "ERROR", "\u274c"
                  elif tc.find("skipped") is not None: s, icon = "SKIPPED", "\u23ed"
                  else: s, icon = "PASS", "\u2705"
                  print(f"- {icon} {tname} ({s})")
                  if s == "PASS": tp += 1
                  elif s == "SKIPPED": ts += 1
                  elif s == "FAIL": tf += 1
                  else: te += 1
              print()
          print(f"**Total: {tp} passed, {tf} failed, {te} errors, {ts} skipped**")
          EOF
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: integration-tests/target/surefire-reports/

  python-release-demo:
    runs-on: ubuntu-latest
    needs: java-contract-tests
    # The suite intentionally includes a schema-drift scenario that BLOCKs
    # the release (exit 1). That's the gate working — don't red-badge the
    # repo for it. The decision stays visible in the job logs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run release suite
        run: python demo/run_release_suite.py
      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-suite-report
          path: reports/
